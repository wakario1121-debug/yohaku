<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>余白</title>
<meta name="theme-color" content="#F4F0EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="余白">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F0EA; --surface:#FBF9F5; --surface2:#F0EBE3; --ink:#3B3633; --ink2:#5E5650; --muted:#8C837B;
  --line:#E4DDD3; --accent:#7D6B5D; --accent-soft:#E9E1D7; --rose:#B98F82; --rose-soft:#F1E4DE;
  --sage:#8D9A86; --sage-soft:#E6EBE2; --danger:#A45A4E;
  --s1:#2F6FA8; --s2:#C8743A; --s3:#7A6AAE;
  --radius:18px; --shadow:0 1px 2px rgba(60,50,40,.04),0 6px 24px rgba(60,50,40,.05);
  --serif:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75;letter-spacing:.02em}
body{padding-top:env(safe-area-inset-top);min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
.app{max-width:720px;margin:0 auto;padding:0 20px calc(110px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;justify-content:space-between;padding:22px 0 10px}
.brand{font-family:var(--serif);font-size:20px;letter-spacing:.12em;color:var(--ink)}
.brand small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.14em;color:var(--muted);margin-top:-2px}
.sync{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;background:var(--surface);padding:5px 10px;border-radius:99px;border:1px solid var(--line);cursor:pointer}
.sync i{width:7px;height:7px;border-radius:50%;background:#C9B9A6;display:inline-block}
.sync.ok i{background:var(--sage)} .sync.local i{background:#D3A86E}
h1{font-family:var(--serif);font-weight:600;font-size:24px;letter-spacing:.08em;margin:18px 0 4px;line-height:1.5}
h2{font-family:var(--serif);font-weight:600;font-size:18px;letter-spacing:.06em;margin:0 0 10px;line-height:1.5}
h3{font-size:14px;font-weight:700;margin:0 0 6px;color:var(--ink2);letter-spacing:.06em}
.lead{color:var(--muted);font-size:13.5px;margin:0 0 22px}
.card{background:var(--surface);border-radius:var(--radius);padding:22px;margin:0 0 16px;box-shadow:var(--shadow);border:1px solid rgba(228,221,211,.6)}
.card.soft{background:var(--surface2);box-shadow:none;border:none}
.card.quote{background:transparent;box-shadow:none;border:none;border-left:2px solid var(--rose);border-radius:0;padding:4px 0 4px 16px;font-family:var(--serif);color:var(--ink2);font-size:15px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:640px){.grid-md-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}}
.btn{appearance:none;border:none;background:var(--accent);color:#fff;padding:12px 20px;border-radius:99px;font-size:14px;letter-spacing:.06em;cursor:pointer;transition:opacity .15s;min-height:44px}
.btn:hover{opacity:.9} .btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid #E5CFC9}
.btn.sm{padding:7px 14px;font-size:12.5px;min-height:34px}
.btn.block{width:100%}
.link{background:none;border:none;color:var(--accent);padding:0;cursor:pointer;font-size:13px;text-decoration:underline;text-underline-offset:3px}
label.f{display:block;font-size:13px;font-weight:500;color:var(--ink2);margin:18px 0 6px;letter-spacing:.04em}
label.f .hint{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
textarea,input[type=text],input[type=date],input[type=number]{width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.7;outline:none;transition:border-color .15s}
textarea{min-height:90px;resize:vertical}
textarea:focus,input:focus{border-color:#C7B6A4}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-size:13px;cursor:pointer;color:var(--ink2);min-height:36px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mood{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.mood button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 2px;cursor:pointer;font-size:11px;line-height:1.3;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:6px}
.mood button .dot{width:22px;height:22px;border-radius:50%}
.mood button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.slider{margin:4px 0 2px}
.slider .top{display:flex;justify-content:space-between;align-items:baseline}
.slider .v{font-family:var(--serif);font-size:20px;color:var(--ink);min-width:2ch;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(to right,var(--rose) var(--p,50%),var(--line) var(--p,50%))}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--line)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--rose)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid #CDBFB1;margin-top:-9px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid #CDBFB1}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:-4px}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:18px;cursor:pointer}
.stepper .n{font-family:var(--serif);font-size:24px;min-width:3ch;text-align:center}
.stat{background:var(--surface2);border-radius:14px;padding:14px 12px;text-align:left}
.stat .k{font-size:11.5px;color:var(--muted);letter-spacing:.06em;display:flex;align-items:center;gap:6px}
.stat .k i{width:8px;height:8px;border-radius:50%;display:inline-block}
.stat .n{font-family:var(--serif);font-size:28px;line-height:1.3}
.stat .n small{font-size:12px;color:var(--muted);font-family:var(--sans)}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.progress>div{height:100%;background:var(--sage);border-radius:6px}
.list-item{padding:14px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.list-item:last-child{border-bottom:none}
.list-item .d{font-family:var(--serif);font-size:13px;color:var(--muted);min-width:68px}
.list-item .b{flex:1;min-width:0}
.list-item .t{font-size:14px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-right:6px}
.tag.rose{background:var(--rose-soft);color:#94675A}.tag.sage{background:var(--sage-soft);color:#5F6E58}
.hub{display:grid;gap:12px}
.hub a{display:flex;gap:16px;align-items:center;text-decoration:none;color:inherit;background:var(--surface);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);border:1px solid rgba(228,221,211,.6)}
.hub a .ic{width:42px;height:42px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex:none;color:var(--accent)}
.hub a b{display:block;font-weight:500;font-size:15px}
.hub a span{font-size:12.5px;color:var(--muted)}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(251,249,245,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.bottom .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);text-decoration:none;padding:6px 0;letter-spacing:.06em}
nav.bottom a.on{color:var(--ink)}
nav.bottom a svg{width:22px;height:22px}
.back{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);text-decoration:none;margin-top:14px}
.steps{display:flex;gap:4px;margin:6px 0 18px}
.steps i{flex:1;height:3px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--rose)}
.box5{display:grid;gap:12px}
.box5 .bx{border-radius:14px;padding:14px 16px;background:#fff;border:1px solid var(--line)}
.box5 .bx h3{display:flex;align-items:center;gap:8px}
.box5 .bx h3 em{font-style:normal;font-family:var(--serif);font-size:13px;width:22px;height:22px;border-radius:50%;background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;color:var(--accent)}
.note{font-size:13px;background:var(--rose-soft);color:#7E5A4F;padding:12px 14px;border-radius:12px;margin:10px 0}
.note.sage{background:var(--sage-soft);color:#56634F}
.note.plain{background:var(--surface2);color:var(--ink2)}
.chart-wrap{position:relative}
.chart-wrap svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:var(--shadow);white-space:nowrap;display:none;z-index:2}
.tip .r{display:flex;align-items:center;gap:6px}.tip .r i{width:8px;height:8px;border-radius:50%}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin:6px 0 0;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:14px;height:2px;border-radius:2px;display:inline-block}
.seg{display:inline-flex;background:var(--surface2);border-radius:99px;padding:3px}
.seg button{border:none;background:transparent;border-radius:99px;padding:4px 12px;font-size:12px;cursor:pointer;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.day{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.day:last-child{border-bottom:none}
.day .chk{width:28px;height:28px;border-radius:50%;border:1.5px solid #CDBFB1;flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;margin-top:2px}
.day .chk.on{background:var(--sage);border-color:var(--sage);color:#fff}
.day .num{font-family:var(--serif);font-size:12px;color:var(--muted)}
.day.today{background:linear-gradient(90deg,var(--rose-soft),transparent);margin:0 -22px;padding:14px 22px}
.chat{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.msg{max-width:88%;padding:12px 16px;border-radius:18px;font-size:14.5px;white-space:pre-wrap;word-break:break-word}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.composer{position:sticky;bottom:calc(74px + env(safe-area-inset-bottom));background:var(--bg);padding:8px 0 4px;display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:48px;max-height:160px}
.modal{position:fixed;inset:0;background:rgba(40,34,30,.32);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:16px}
.modal .sheet{background:var(--surface);border-radius:22px;padding:24px;max-width:480px;width:100%;margin-bottom:env(safe-area-inset-bottom);box-shadow:0 10px 40px rgba(0,0,0,.15)}
@media(min-width:640px){.modal{align-items:center}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:.92}
.pat{padding:16px 0;border-bottom:1px solid var(--line)}
.pat:last-child{border-bottom:none}
.lvl{display:flex;gap:3px}.lvl i{width:18px;height:5px;border-radius:3px;background:var(--line)}.lvl i.on{background:var(--rose)}
.ev{font-size:12.5px;color:var(--ink2);background:var(--surface2);border-radius:10px;padding:8px 12px;margin-top:6px}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:10px}
.bars .bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .bc div{width:100%;max-width:28px;background:var(--sage);border-radius:4px 4px 0 0;min-height:2px}
.bars .bc span{font-size:10px;color:var(--muted)}
.bars .bc b{font-size:11px;font-weight:500;color:var(--ink2)}
.timer{font-family:var(--serif);font-size:44px;text-align:center;color:var(--accent);margin:12px 0}
hr.sp{border:none;height:1px;background:var(--line);margin:22px 0}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">余白<small>こころの整理ノート</small></div>
    <div class="sync" id="sync" data-act="go" data-to="data"><i></i><span>読み込み中</span></div>
  </header>
  <main id="view"></main>
</div>
<nav class="bottom"><div class="in" id="nav"></div></nav>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
"use strict";
/* ============ utilities ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nl = s => esc(s).replace(/\n/g,"<br>");
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today = () => ymd(new Date());
const parseD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parseD(s); d.setDate(d.getDate()+n); return ymd(d); };
const diffDays = (a,b) => Math.round((parseD(b)-parseD(a))/86400000);
const jpDate = s => { const d = parseD(s); return (d.getMonth()+1)+"月"+d.getDate()+"日（"+"日月火水木金土"[d.getDay()]+"）"; };
const shortD = s => { const d = parseD(s); return (d.getMonth()+1)+"/"+d.getDate(); };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
const r1 = n => n==null ? "—" : (Math.round(n*10)/10).toString();
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("on"),2000); }

/* ============ state & storage ============ */
const LS_KEY = "yohaku.v1";
const blank = () => ({ journal:{}, thoughts:{}, solo:{}, miren:{answers:{}, updatedAt:0}, review:{updatedAt:0}, program:{start:null, done:{}, notes:{}, updatedAt:0}, chat:{msgs:[], updatedAt:0}, meta:{selfRate:{}, patternAI:null, updatedAt:0}, tomb:[] });
let S = blank();
try { const raw = localStorage.getItem(LS_KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch(e){}

let COL = null, SAMPLE = null; // release version: data stays on this device only
let syncState = "ok";
function setSync(){
  const el = $("#sync"); const lb = S.meta.lastBackup; const hasData = Object.keys(S.journal).length >= 3;
  const stale = hasData && (!lb || Date.now() - lb > 7*86400000);
  el.className = "sync " + (stale ? "local" : "ok");
  el.querySelector("span").textContent = stale ? "バックアップのおすすめ" : "端末に保存";
}
// second copy in IndexedDB, so one storage failing doesn't lose everything
const IDB = {
  db: null,
  open(){ return new Promise((res)=>{ try { const r = indexedDB.open("yohaku", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => res(null); } catch(e){ res(null); } }); },
  get(k){ return new Promise(res=>{ if (!this.db) return res(null); try { const q = this.db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result||null); q.onerror = () => res(null); } catch(e){ res(null); } }); },
  set(k,v){ if (!this.db) return; try { this.db.transaction("kv","readwrite").objectStore("kv").put(v,k); } catch(e){} }
};
let idbTimer = null;
function saveLocal(){
  let ok = true;
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){ ok = false; }
  clearTimeout(idbTimer); idbTimer = setTimeout(()=>IDB.set("state", JSON.stringify(S)), 300);
  if (!ok) toast("保存領域がいっぱいです。バックアップを書き出してください");
}
function persist(kind, key){
  const now = Date.now();
  if (["journal","thoughts","solo"].includes(kind)) { if (S[kind][key]) S[kind][key].updatedAt = now; }
  else S[kind].updatedAt = now;
  saveLocal(); setSync();
}
function removeItem(kind, key){ delete S[kind][key]; saveLocal(); }
const countAll = st => Object.keys(st.journal||{}).length + Object.keys(st.thoughts||{}).length + Object.keys(st.solo||{}).length;
async function initLocal(){
  await IDB.open();
  const raw = await IDB.get("state");
  if (raw) { try { const d = Object.assign(blank(), JSON.parse(raw)); if (countAll(d) > countAll(S)) { S = d; saveLocal(); render(); } } catch(e){} }
  else saveLocal();
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch(e){}
  setSync();
}

/* ============ content ============ */
const MOODS = [
  {v:5,label:"穏やか",c:"#A9B7A2"},{v:4,label:"まあまあ",c:"#C9C3A3"},{v:3,label:"ゆらぐ",c:"#D9C2A7"},{v:2,label:"しんどい",c:"#CFA79A"},{v:1,label:"とてもつらい",c:"#B98F82"}
];
const moodOf = v => MOODS.find(m=>m.v===v);
const SCORES = [
  {k:"lonely",label:"寂しさ"},{k:"attach",label:"未練"},{k:"reunion",label:"復縁したい気持ち"},{k:"blame",label:"自分を責める気持ち"},{k:"anxiety",label:"不安"}
];
const WORDS = [
  "彼が戻ってきても、戻ってこなくても、わたしは自分の人生を幸せにできる。",
  "気持ちは消すものではなく、置き場所を見つけるもの。",
  "数値が下がらない日も、記録を続けたあなたは前に進んでいます。",
  "わからないことは、わからないまま置いておいていい。",
  "反省は「次にどうするか」の話。自分を否定する話ではありません。",
  "寂しさは、あなたが誰かを大切にできる人だという証拠でもあります。",
  "今日は、自分のために一つだけ何かをしてみましょう。",
  "相手の気持ちは相手のもの。あなたの時間は、あなたのもの。",
  "回復は一直線ではなく、波を描きながら進みます。",
  "好きな気持ちと、安心できる関係。その両方を大切にしていい。"
];
const MIREN = [

function syncRange(el){ const p = (el.value - el.min)/(el.max - el.min)*100; el.style.setProperty("--p", p+"%"); const o = document.getElementById(el.dataset.out); if (o) o.textContent = el.value; }
document.addEventListener("input", e => { if (e.target.type==="range") syncRange(e.target); });

function confirmBox(title, body, okLabel="削除する", danger=true){
  return new Promise(res => {
    $("#modalRoot").innerHTML = `<div class="modal"><div class="sheet"><h2>${esc(title)}</h2><p class="muted small">${body}</p><div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn ghost" id="mNo">キャンセル</button><button class="btn ${danger?"danger":""}" id="mOk">${esc(okLabel)}</button></div></div></div>`;
    const close = v => { $("#modalRoot").innerHTML=""; res(v); };
    $("#mNo").onclick = () => close(false); $("#mOk").onclick = () => close(true);
    $(".modal").onclick = e => { if (e.target.classList.contains("modal")) close(false); };
  });
}

/* ============ data helpers ============ */
const entries = () => Object.entries(S.journal).map(([k,v])=>({date:k,...v})).sort((a,b)=>a.date<b.date?1:-1);
function weekRange(offset=0){ const t = today(); return [addDays(t,-6-7*offset), addDays(t,-7*offset)]; }
const inRange = (d,[a,b]) => d>=a && d<=b;
function programInfo(){
  const P = S.program; const done = Object.keys(P.done).filter(k=>P.done[k]).length;
  const elapsed = P.start ? Math.min(30, diffDays(P.start, today())+1) : 0;
  let next = PROGRAM.findIndex((_,i)=>!P.done[i+1]);
  return {done, elapsed, next: next<0 ? null : next+1};
}

    ${chartHTML()}
    ${trendText()}</div>`;
  // growth
  out += growthCard();

function statTiles(e){
  const cols = [["lonely","寂しさ","var(--s1)"],["attach","未練","var(--s2)"],["anxiety","不安","var(--s3)"]];
  return `<div class="grid3">${cols.map(([k,l,c])=>`<div class="stat"><div class="k"><i style="background:${c}"></i>${l}</div><div class="n">${e[k]??"—"}<small> /10</small></div></div>`).join("")}</div>`;
}
const SERIES = [["lonely","寂しさ","#2F6FA8"],["attach","未練","#C8743A"],["anxiety","不安","#7A6AAE"]];
function chartData(){
  const n = UI.chartDays, t = today(); const days = [];
  for (let i=n-1;i>=0;i--){ const d = addDays(t,-i); days.push({d, e:S.journal[d]}); }
  return days;
}
function chartHTML(){
  const days = chartData(); const pts = days.filter(x=>x.e);
  if (pts.length < 2) return `<div class="note plain">記録が2日分以上たまると、ここに気持ちの変化がグラフで表示されます。</div>`;
  if (UI.chartTable) {
    return `<div style="overflow-x:auto"><table style="width:100%;font-size:12.5px;border-collapse:collapse"><tr class="muted"><td>日付</td>${SERIES.map(s=>`<td>${s[1]}</td>`).join("")}</tr>${pts.slice().reverse().map(p=>`<tr style="border-top:1px solid var(--line)"><td>${shortD(p.d)}</td>${SERIES.map(s=>`<td>${p.e[s[0]]??"—"}</td>`).join("")}</tr>`).join("")}</table></div><button class="link" data-act="chartTable" style="margin-top:8px">グラフで見る</button>`;
  }
  const W=340,H=180,L=22,R=40,T=10,B=22, n=days.length;
  const x = i => L + (n===1?0:i*(W-L-R)/(n-1)), y = v => T + (10-v)*(H-T-B)/10;
  let g = "";
  [0,5,10].forEach(v=>{ g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#E9E3DA" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" font-size="10" fill="#8C837B" text-anchor="end">${v}</text>`; });
  const step = n<=7?1:n<=14?2:5;
  days.forEach((p,i)=>{ if (i%step===0 || i===n-1) g += `<text x="${x(i)}" y="${H-6}" font-size="10" fill="#8C837B" text-anchor="middle">${shortD(p.d)}</text>`; });
  const labels = [];
  SERIES.forEach(([k,l,c])=>{
    const ps = days.map((p,i)=>p.e && p.e[k]!=null ? [x(i),y(+p.e[k]),+p.e[k]] : null).filter(Boolean);
    if (!ps.length) return;
    g += `<polyline fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${ps.map(p=>p[0]+","+p[1]).join(" ")}"/>`;
    ps.forEach(p=>{ g += `<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="${c}" stroke="#FBF9F5" stroke-width="2"/>`; });
    const last = ps[ps.length-1]; labels.push({y:last[1], c, l, x:last[0]});
  });
  labels.sort((a,b)=>a.y-b.y); for (let i=1;i<labels.length;i++) if (labels[i].y - labels[i-1].y < 13) labels[i].y = labels[i-1].y + 13;
  labels.forEach(lb=>{ g += `<text x="${lb.x+8}" y="${lb.y+4}" font-size="10.5" fill="#5E5650">${lb.l}</text>`; });
  g += `<line id="cx" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="#CDBFB1" stroke-width="1" style="display:none"/>`;
  g += `<rect id="hit" x="${L}" y="0" width="${W-L-R}" height="${H}" fill="transparent"/>`;
  return `<div class="chart-wrap" id="chart" data-w="${W}" data-l="${L}" data-r="${R}" data-n="${n}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="寂しさ・未練・不安の推移">${g}</svg><div class="tip" id="tip"></div></div>
  <div class="row between"><div class="legend">${SERIES.map(s=>`<span><i style="background:${s[2]}"></i>${s[1]}</span>`).join("")}</div><button class="link" data-act="chartTable">表で見る</button></div>`;
}
function bindChart(){
  const wrap = $("#chart"); if (!wrap) return;
  const svg = wrap.querySelector("svg"), tip = $("#tip"), cx = $("#cx"); const days = chartData();
  const W=+wrap.dataset.w, L=+wrap.dataset.l, R=+wrap.dataset.r, n=+wrap.dataset.n;
  const move = ev => {
    const rect = svg.getBoundingClientRect(); const px = (ev.clientX - rect.left) * W / rect.width;
    let i = Math.round((px - L) / ((W-L-R)/(n-1))); i = Math.max(0, Math.min(n-1, i));
    // snap to nearest recorded day
    let best = -1, bd = 1e9; days.forEach((p,j)=>{ if (p.e && Math.abs(j-i)<bd){ bd=Math.abs(j-i); best=j; } });
    if (best<0) return; const p = days[best]; const X = L + best*(W-L-R)/(n-1);
    cx.setAttribute("x1",X); cx.setAttribute("x2",X); cx.style.display="";
    tip.innerHTML = `<div style="margin-bottom:4px">${jpDate(p.d)}</div>` + SERIES.map(s=>`<div class="r"><i style="background:${s[2]}"></i>${s[1]}　<b>${p.e[s[0]]??"—"}</b></div>`).join("");
    tip.style.display="block"; const sx = X*rect.width/W; const tw = tip.offsetWidth;
    tip.style.left = Math.max(0, Math.min(rect.width - tw, sx - tw/2)) + "px"; tip.style.top = "-8px";
  };
  const hit = $("#hit"); hit.addEventListener("pointermove", move); hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", ()=>{ tip.style.display="none"; cx.style.display="none"; });
}
function trendText(){
  const E = S.journal; const cur = weekRange(0), prev = weekRange(1);
  const pick = (rng,k) => Object.entries(E).filter(([d])=>inRange(d,rng)).map(([,e])=>e[k]).filter(v=>v!=null).map(Number);
  const parts = [];
  [["attach","未練"],["lonely","寂しさ"]].forEach(([k,l])=>{
    const a = avg(pick(prev,k)), b = avg(pick(cur,k));
    if (a==null || b==null) return;
    if (b < a - 0.3) parts.push(`${l}は先週より少し落ち着いています（平均 ${r1(a)} → ${r1(b)}）。`);
    else if (b > a + 0.3) parts.push(`${l}は今週、波が大きめでした（平均 ${r1(a)} → ${r1(b)}）。揺り戻しは回復の途中でよく起こることで、後退ではありません。`);
    else parts.push(`${l}は先週と同じくらいです（平均 ${r1(b)}）。変わらない時期も、整理が進んでいる時期です。`);
  });
  const cnt = Object.keys(E).filter(d=>inRange(d,cur)).length;
  if (!parts.length) return cnt ? `<p class="small muted" style="margin:12px 0 0">今週は${cnt}日記録しました。2週間分たまると、先週との比較が表示されます。</p>` : "";
  return `<div class="note sage" style="margin-top:14px">${parts.join("<br>")}</div>`;
}

function autoSort(raw){
  const parts = raw.split(/(?<=[。！？!?\n])/).map(s=>s.trim()).filter(Boolean);
  const r = {facts:[],imagined:[],want:[],cando:[],unknown:[]};
  parts.forEach(p=>{
    if (/知りたい|聞きたい|確かめたい/.test(p)) r.want.push(p);
    else if (/かな|だろう|かも|はず|きっと|もしかして|違いない|でしょう|[？?]/.test(p)) { r.imagined.push(p); r.unknown.push(p.replace(/[。]/g,"")); }
    else r.facts.push(p);
  });
  if (!r.want.length) r.want.push("（例）私は大切にされていたのか、知りたい");
  r.cando.push("（例）今日の気持ちを記録する／友人に連絡する／30分、自分のための時間をとる");
  return Object.fromEntries(Object.entries(r).map(([k,v])=>[k,v.join("\n")]));
}

function allTexts(){
  const out = [];
  Object.entries(S.journal).forEach(([d,e])=>["event","hardest","free"].forEach(k=>{ if (e[k]) out.push({src:"記録 "+shortD(d), text:e[k]}); }));
  Object.values(S.thoughts).forEach(t=>out.push({src:"考えの整理 "+shortD(t.date), text:t.raw}));
  Object.entries(S.miren.answers||{}).forEach(([k,v])=>{ if (v) out.push({src:"未練の整理", text:v}); });
  REV.forEach(([k])=>{ if (S.review[k]) out.push({src:"振り返り", text:S.review[k]}); });
  return out;
}
function patternScores(){
  const T = allTexts(); const sr = S.meta.selfRate || {};
  const E = Object.values(S.journal);
  const thoughtsN = Object.keys(S.thoughts).length;
  const res = PATTERNS.map(p=>{
    const hits = [];
    T.forEach(t=>{ t.text.split(/(?<=[。！？!?\n])/).forEach(s=>{ if (p.re.test(s) && hits.length<40) hits.push({src:t.src, s:s.trim()}); }); });
    let ev = Math.min(1, hits.length/6);
    if (p.k==="imagine") ev = Math.min(1, ev*0.6 + Math.min(1, thoughtsN/5)*0.4 + (avg(E.map(e=>+e.recall||0))>5?0.2:0));
    if (p.k==="reassure") { const a = avg(E.map(e=>+e.anxiety).filter(v=>!isNaN(v))); if (a!=null && a>=6) ev = Math.min(1, ev+0.2); }
    const self = sr[p.k]; // 0..4
    const score = self!=null ? (T.length+E.length < 8 ? self/4*0.7 + ev*0.3 : self/4*0.45 + ev*0.55) : ev;
    return {...p, hits, ev, self, score};
  });
  return res;
}

}

  </div>
  <div class="card"><p class="small muted" style="margin:0">2</p><h2>相談用の文章をコピーする</h2>
    <p class="small muted" style="margin:-4px 0 12px">相手の気持ちを推測しない・根拠のない期待を持たせない・必要なら率直に指摘する、といったカウンセラーの方針も一緒に入ります。</p>
    <button class="btn block" data-act="copyChat">相談用の文章をコピー</button>
    ${UI.copyShown ? `<textarea readonly id="copyTa" style="margin-top:12px;font-size:11px;min-height:100px">${esc(UI.copyShown)}</textarea>` : ""}
  </div>
  <div class="card"><p class="small muted" style="margin:0">3</p><h2>Claudeアプリに貼り付けて話す</h2>
    <p class="small" style="margin:0">Claudeアプリで新しいチャットを開き、貼り付けて送信してください。そのまま対話を続けられます。</p>
    <p class="small muted" style="margin:8px 0 0">※ Claudeとの対話にはインターネット接続が必要です。記録や整理は、ネットがなくても使えます。</p>
  </div>
  <div class="card"><h2>対話で心に残ったこと</h2><p class="small muted" style="margin:-4px 0 10px">気づいたこと、次にやってみたいことを残しておくと、次の相談のときにも伝わります。</p>
    <textarea id="noteIn" placeholder="例：「わからないことは置いておく」と言われて、少し楽になった"></textarea>
    <button class="btn soft block" style="margin-top:10px" data-act="saveNote">残しておく</button>
    ${notes.map(n=>`<div class="list-item" style="cursor:default"><div class="d">${shortD(ymd(new Date(n.at)))}</div><div class="b"><div style="font-size:14px;white-space:pre-wrap">${esc(n.content)}</div></div><button class="link small" data-act="delNote" data-at="${n.at}">削除</button></div>`).join("")}
  </div>`;
}
async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; }
  catch(e){ try { const ta = document.createElement("textarea"); ta.value = t; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length); const ok = document.execCommand("copy"); ta.remove(); return ok; } catch(e2){ return false; } }
}
document.addEventListener("input", e => { if (e.target.id==="chatIn") UI.chatDraft = e.target.value; });
document.addEventListener("change", e => { if (e.target.id==="chatCtx") UI.chatCtx = e.target.checked; });

/* ============ DATA ============ */
function vData(){
  const counts = `記録 ${Object.keys(S.journal).length}日分・考えの整理 ${Object.keys(S.thoughts).length}件・一人の時間 ${Object.keys(S.solo).length}件`;
  const lb = S.meta.lastBackup;
  return `${backLink()}<h1>データとプライバシー</h1>
  <div class="card"><h2>保存のしくみ</h2>
  <p class="small">記録はすべて、この端末の中だけに保存されます。インターネットに送られることはなく、アプリの作成者を含め、ほかの誰も見ることはできません。ネットがつながらない場所でも、すべての機能が使えます（Claudeとの対話を除く）。</p>
  <p class="small muted" style="margin:0">${counts}</p></div>

  <button class="btn block" data-act="exportFile">バックアップを保存する</button>
  <div class="row" style="margin-top:10px"><button class="btn ghost sm" data-act="exportCopy">テキストでコピー</button></div>

  <hr class="sp"><h3>バックアップから戻す</h3><p class="small muted" style="margin:0 0 10px">今の記録は消えず、バックアップの内容と合わせられます。テスト版で「データをコピー」した内容もここに貼り付けられます。</p>
  <div class="row"><label class="btn soft sm" style="display:inline-flex;align-items:center">ファイルを選ぶ<input type="file" id="importFile" accept=".json,application/json,text/plain" class="sr"></label><button class="btn ghost sm" data-act="showImport">テキストを貼り付け</button></div>
  ${UI.showImport ? `<textarea id="importTa" style="font-size:11px;margin-top:10px"></textarea><button class="btn sm" style="margin-top:10px" data-act="doImport">読み込む</button>` : ""}
  </div>
  <div class="card"><h2>つらさが強いときは</h2><p class="small">気持ちが限界に近いとき、自分を傷つけたい気持ちがあるときは、一人で抱えずに相談してください。</p>
  <p class="small" style="margin:0">よりそいホットライン（24時間・無料）<br><b>0120-279-338</b></p><p class="small" style="margin:10px 0 0">いのちの電話（ナビダイヤル）<br><b>0570-783-556</b></p>
  <p class="small muted" style="margin:10px 0 0">このアプリは医療やカウンセリングの代わりではありません。</p></div>
  <div class="card"><h2>すべてのデータを削除</h2><p class="small muted">記録・整理・メモをすべて消去します。元に戻せません。</p><button class="btn danger" data-act="wipe">すべて削除する</button></div>
  <p class="small muted" style="text-align:center">余白 v1.0</p>`;
}
function mergeData(d){
  let n = 0;
  ["journal","thoughts","solo"].forEach(k=>Object.entries(d[k]||{}).forEach(([key,v])=>{ if (v && (!S[k][key] || (v.updatedAt||0)>(S[k][key].updatedAt||0))) { S[k][key]=v; n++; } }));
  ["miren","review","program","chat","meta"].forEach(k=>{ if (d[k] && (d[k].updatedAt||0)>(S[k].updatedAt||0)) { const keep = S.meta.lastBackup; S[k]=Object.assign(blank()[k], d[k]); if (k==="meta" && keep) S.meta.lastBackup = keep; n++; } });
  saveLocal(); return n;
}
document.addEventListener("change", async e => {
  if (e.target.id==="importFile" && e.target.files[0]) {
    try { const d = JSON.parse(await e.target.files[0].text()); const n = mergeData(d); toast(n+"件を読み込みました"); render(); } catch(err){ toast("バックアップの形式が正しくありません"); }
  }
});

/* ============ actions ============ */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act;
  const A = {
    go: () => { e.preventDefault(); if (el.dataset.to==="journal") { UI.journalEdit=null; UI.journalForm=null; } go(el.dataset.to); },
    chartDays: () => { UI.chartDays = +el.dataset.n; render(); },
    chartTable: () => { UI.chartTable = !UI.chartTable; render(); },
    startProgram: () => { S.program.start = today(); persist("program"); go("program"); },
    editJournal: () => { UI.journalEdit = el.dataset.date; UI.journalForm = null; go("journal"); },
    mood: () => { UI.journalForm.mood = +el.dataset.v; document.querySelectorAll(".mood button").forEach(b=>b.classList.toggle("on", +b.dataset.v===UI.journalForm.mood)); },
    recall: () => { UI.journalForm.recall = Math.max(0, UI.journalForm.recall + +el.dataset.d); $("#recallN").textContent = UI.journalForm.recall; },
    delJournal: async () => { if (await confirmBox("この日の記録を削除しますか？", esc(jpDate(el.dataset.date))+"の記録を削除します。元に戻せません。")) { removeItem("journal", el.dataset.date); UI.journalEdit=null; UI.journalForm=null; toast("削除しました"); render(); } },
    mirenNav: () => { saveMirenTa(); UI.mirenStep = Math.max(0, Math.min(MIREN.length-1, UI.mirenStep + +el.dataset.d)); render(); window.scrollTo(0,0); },
    mirenJump: () => { saveMirenTa(); UI.mirenStep = +el.dataset.i; render(); },
    mirenDone: () => { saveMirenTa(); UI.mirenSummary = true; toast("保存しました"); render(); window.scrollTo(0,0); },
    mirenSummary: () => { saveMirenTa(); UI.mirenSummary = true; render(); window.scrollTo(0,0); },
    mirenBack: () => { UI.mirenSummary = false; render(); },
    askAI: () => { UI.chatDraft = "未練の整理で書いたこと（記録に含まれています）を読んで、今の私の気持ちを一緒に整理してほしいです。"; go("chat"); },
    thEx: () => { const t = $("#thRaw"); t.value = (t.value ? t.value.trim()+"\n" : "") + el.dataset.t; },
    thStart: () => { const raw = $("#thRaw").value.trim(); if (!raw) { toast("考えを書いてみてください"); return; } UI.thought = {id:uid(), raw, date:today(), createdAt:Date.now()}; UI.thoughtStep = 1; render(); },
    thOpen: () => { const t = S.thoughts[el.dataset.id]; UI.thought = {...t, id:el.dataset.id}; UI.thoughtStep = 1; render(); },
    thCancel: () => { e.preventDefault(); UI.thought = null; UI.thoughtStep = 0; render(); },
    thAuto: () => { readBoxes(); const r = autoSort(UI.thought.raw); BOXES.forEach(([k])=>{ if (!UI.thought[k]) UI.thought[k] = r[k]; }); render(); toast("下書きを入れました。自由に直してください"); },
    thAI: async () => { readBoxes(); UI.aiBusy = true; render();
      try {
        const v = await SAMPLE.json(`次の文章は、失恋したばかりの人が書いた「止まらない考え」です。これを5つの箱に分ける下書きを作ってください。
厳守事項：元恋人の気持ちや考えを推測・断定しないこと。文章に書かれていない事実を作らないこと。「今できること」は、相手ではなく本人が自分でできる小さな行動にすること。やさしい日本語で。
出力はJSONのみ：{"facts":"実際に起きた事実（改行区切り）","imagined":"本人が想像していること","want":"本人が本当に知りたいこと・その奥にある問い","cando":"今、本人にできること","unknown":"今は答えが出ないこと"}
文章：
${UI.thought.raw}`, {modelTier:"quick"});
        BOXES.forEach(([k])=>{ if (v && typeof v[k]==="string" && !UI.thought[k]) UI.thought[k] = v[k]; else if (v && Array.isArray(v[k]) && !UI.thought[k]) UI.thought[k] = v[k].join("\n"); });
        toast("下書きを入れました。自由に直してください");
      } catch(err){ toast("AIを使えませんでした。手動で分けてみましょう"); if (err && err.code==="not_granted") SAMPLE=null; }
      UI.aiBusy = false; render(); },
    thNext: () => { readBoxes(); UI.thoughtStep = 2; UI.parkLeft = 60; render(); window.scrollTo(0,0); },
    thBackStep: () => { e.preventDefault(); UI.thoughtStep = 1; clearInterval(UI.parkInt); UI.parkRunning=false; render(); },
    parkTimer: () => { if (UI.parkRunning) return; UI.parkRunning = true; UI.parkLeft = 60; render();
      UI.parkInt = setInterval(()=>{ UI.parkLeft--; const t = $("#parkT"); if (t) t.textContent = UI.parkLeft; if (UI.parkLeft<=0) { clearInterval(UI.parkInt); UI.parkRunning=false; if (route()==="thoughts") render(); toast("おつかれさまでした"); } }, 1000); },
    thPark: () => { clearInterval(UI.parkInt); UI.parkRunning=false; const t = UI.thought; const {id, ...rest} = t; S.thoughts[id] = {...rest, parked:true}; persist("thoughts", id);
      if (S.program.start) [9,10,13].some(n=>{ if (!S.program.done[n]) { S.program.done[n]=true; persist("program"); return true; } });
      UI.thought = null; UI.thoughtStep = 0; toast("箱にしまいました"); render(); },
    saveReview: () => { document.querySelectorAll("[data-rv]").forEach(t=>S.review[t.dataset.rv] = t.value.trim()); persist("review"); toast("保存しました"); render(); },
    soloCat: () => { UI.soloForm.cat = el.dataset.k; document.querySelectorAll('[data-act=soloCat]').forEach(b=>b.classList.toggle("on", b.dataset.k===UI.soloForm.cat)); },
    soloSave: () => { const text = $("#soText").value.trim(); if (!text) { toast("内容を書いてみてください"); return; }
      const id = UI.soloEdit || uid(); const prev = S.solo[id] || {createdAt:Date.now()};
      S.solo[id] = {...prev, cat:UI.soloForm.cat, text, date:$("#soDate").value||today(), min: +$("#soMin").value || 0}; persist("solo", id);
      UI.soloEdit = null; UI.soloForm = null; toast("記録しました"); render(); },
    soloEdit: () => { UI.soloEdit = el.dataset.id; UI.soloForm = null; render(); window.scrollTo(0, 300); },
    soloCancel: () => { UI.soloEdit = null; UI.soloForm = null; render(); },
    soloDel: async () => { if (await confirmBox("この記録を削除しますか？","元に戻せません。")) { removeItem("solo", el.dataset.id); UI.soloEdit=null; UI.soloForm=null; render(); } },
    idea: () => { UI.ideaI = (UI.ideaI ?? diffDays("2026-01-01",today())) + 1; render(); },
    selfRate: () => { S.meta.selfRate = S.meta.selfRate || {}; const k = el.dataset.k, v = +el.dataset.v; if (S.meta.selfRate[k]===v) delete S.meta.selfRate[k]; else S.meta.selfRate[k] = v; persist("meta"); render(); },
    copyPattern: async () => { const t = `${AI_RULES}\n\n# ユーザーの記録（アプリ「余白」より）\n${contextText()}\n\n# 依頼\n上の記録全体を読み、次の観点から恋愛における思考・感情・行動の傾向を「仮説」として分析してください：連絡がないと自分の価値を疑う／愛情を確認しても安心が続かない／察してほしい／相手の行動を愛情の証拠として判断する／相手の気持ちを想像し続ける／不安なとき反応を試す／希望を伝えるのが苦手／相手に合わせすぎる／好きな気持ちと安心できる関係を区別できているか。\n記録に根拠があるものだけを取り上げ、根拠（どの記録か）を短く添えること。根拠が少ない観点は「まだ判断材料が少ない」と書くこと。診断や性格の断定はしない。最後に、その傾向の奥にありそうな大切なニーズと、次の関係で役立つ小さな練習を2つ。全体で600字程度、見出しは使わず短い段落で。`;
      toast(await copyText(t) ? "コピーしました。Claudeアプリに貼り付けてください" : "コピーできませんでした"); },
    savePattern: () => { const v = $("#patIn").value.trim(); S.meta.patternAI = v ? {text:v, at:Date.now()} : null; persist("meta"); toast("保存しました"); render(); },
    toggleDay: () => { const n = +el.dataset.n; S.program.done[n] = !S.program.done[n]; persist("program"); render(); },
    openDay: () => { const n = +el.dataset.n; UI.openDay = UI.openDay===n ? -1 : n; render(); },
    dayNote: () => { const n = +el.dataset.n; const t = document.querySelector(`[data-dnote="${n}"]`); S.program.notes[n] = t.value.trim(); S.program.done[n] = true; persist("program"); toast("Day "+n+" 完了"); UI.openDay = null; render(); },
    resetProgram: async () => { if (await confirmBox("プログラムをやり直しますか？","完了状況とメモがリセットされ、今日からDay 1が始まります。","やり直す")) { S.program = {start:today(), done:{}, notes:{}, updatedAt:0}; persist("program"); render(); } },
    starter: () => { const t = $("#chatIn"); t.value = el.dataset.t; UI.chatDraft = el.dataset.t; },
    copyChat: async () => { const t = chatPrompt(($("#chatIn").value||"").trim(), UI.chatCtx !== false); const ok = await copyText(t);
      if (ok) { UI.copyShown = null; toast("コピーしました。Claudeアプリに貼り付けてください"); } else { UI.copyShown = t; render(); toast("下の文章を長押ししてコピーしてください"); } },
    saveNote: () => { const v = $("#noteIn").value.trim(); if (!v) return; S.chat.msgs = (S.chat.msgs||[]).filter(m=>m.role==="note"); S.chat.msgs.push({role:"note", content:v, at:Date.now()}); persist("chat"); toast("残しました"); render(); },
    delNote: async () => { if (await confirmBox("このメモを削除しますか？","元に戻せません。")) { S.chat.msgs = S.chat.msgs.filter(m=>String(m.at)!==el.dataset.at); persist("chat"); render(); } },
    exportFile: async () => {
      S.meta.lastBackup = Date.now(); saveLocal();
      const name = "yohaku-backup-" + today() + ".json";
      const blob = new Blob([JSON.stringify(S, null, 1)], {type:"application/json"});
      try {
        const file = new File([blob], name, {type:"application/json"});
        if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:name}); toast("保存しました"); setSync(); render(); return; }
      } catch(err){ if (err && err.name==="AbortError") { S.meta.lastBackup = null; saveLocal(); return; } }
      const a2 = document.createElement("a"); a2.href = URL.createObjectURL(blob); a2.download = name; document.body.appendChild(a2); a2.click(); a2.remove(); setTimeout(()=>URL.revokeObjectURL(a2.href), 5000);
      toast("保存しました"); setSync(); render(); },
    exportCopy: async () => { S.meta.lastBackup = Date.now(); saveLocal(); setSync(); const ok = await copyText(JSON.stringify(S)); if (ok) toast("コピーしました。メモアプリなどに貼って保管してください"); else { UI.showExport = true; render(); toast("表示されたデータを長押ししてコピーしてください"); } },
    showImport: () => { UI.showImport = !UI.showImport; render(); },
    doImport: () => { try { const n = mergeData(JSON.parse($("#importTa").value)); UI.showImport=false; toast(n+"件を読み込みました"); render(); } catch(err){ toast("データの形式が正しくありません"); } },
    wipe: async () => { if (!(await confirmBox("すべてのデータを削除しますか？","日々の記録、整理、プログラム、メモのすべてが消えます。元に戻せません。<br>削除する前に、バックアップの保存をおすすめします。","すべて削除"))) return;
      S = blank(); saveLocal(); IDB.set("state", JSON.stringify(S)); toast("削除しました"); go("home"); }
  };
  if (A[a]) A[a]();
});

/* ============ boot ============ */
render();
initLocal();
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").then(reg => {
    reg.addEventListener("updatefound", () => { const w = reg.installing; if (!w) return; w.addEventListener("statechange", () => { if (w.state === "installed" && navigator.serviceWorker.controller) toast("新しい版を準備しました。次に開いたときに反映されます"); }); });
  }).catch(()=>{});
}
